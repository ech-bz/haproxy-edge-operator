[package]
name = "haproxy-edge-operator"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = { version = "2.4.2", default-features = false, features = ["std", "consensus", "eips", "sol-types", "signer-local", "k256"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
envy = "0.4"
futures = "0.3"
hex = "0.4"
http = "1"
idna = "1.1"
ipnet = "2"
k8s-openapi = { version = "0.27.1", features = ["latest", "schemars"] }
kube = { version = "3.1.0", features = ["client", "derive", "runtime", "rustls-tls", "ws"] }
kube-lease-manager = "0.11"
libc = "0.2"
regex = "1"
schemars = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "io-util", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ech-k8s = { git = "https://github.com/ech-bz/ech-k8s", rev = "686055001cad993f597a766deceed2116709ad98" }

[build-dependencies]
anyhow = "1"
kopium = { version = "0.23", default-features = false }
k8s-openapi = { version = "0.27.1", features = ["latest"] }
serde-saphyr = "0.0.27"
