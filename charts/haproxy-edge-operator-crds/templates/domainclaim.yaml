apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: domainclaims.haproxy.ech.bz
spec:
  group: haproxy.ech.bz
  scope: Cluster
  names:
    plural: domainclaims
    singular: domainclaim
    kind: DomainClaim
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [domain, credentialsSecretRef]
              properties:
                domain:
                  type: string
                  minLength: 1
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: DomainClaim domain is immutable
                ttl:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                  description: DNS TTL and minimum withdrawal delay in seconds. Defaults to 300.
                credentialsSecretRef:
                  type: object
                  required: [name, namespace]
                  description: Secret with octoDNS provider.json configuration.
                  properties:
                    name: {type: string, minLength: 1}
                    namespace: {type: string, minLength: 1}
            status:
              type: object
              properties:
                domain: {type: string}
                holder:
                  type: object
                  required: [name, namespace, uid]
                  properties:
                    name: {type: string}
                    namespace: {type: string}
                    uid: {type: string}
                ready: {type: boolean}
                addresses:
                  type: array
                  items: {type: string}
                observedGeneration:
                  type: integer
                  format: int64
