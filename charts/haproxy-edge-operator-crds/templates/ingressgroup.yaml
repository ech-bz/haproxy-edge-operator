apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ingressgroups.haproxy.ech.bz
spec:
  group: haproxy.ech.bz
  scope: Namespaced
  names:
    plural: ingressgroups
    singular: ingressgroup
    kind: IngressGroup
    shortNames:
      - higroup
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            spec:
              type: object
              required: [hosts]
              properties:
                forwardedTrustedIps:
                  type: array
                  description: Peers allowed to supply X-Forwarded-For for this group's entrypoints.
                  items:
                    type: string
                hosts:
                  type: array
                  minItems: 1
                  description: Domain sets and their routing and ECH configuration.
                  items:
                    type: object
                    required: [domains]
                    properties:
                      domains:
                        type: array
                        minItems: 1
                        items:
                          type: string
                        description: Domains registered in DomainClaim. Each normalized domain must occur only once across all hosts.
                      ech:
                        type: string
                        minLength: 1
                        description: ICANN cover domain registered in DomainClaim. The operator manages ECH keys, addresses and the cover certificate automatically.
                      routes:
                        type: array
                        items:
                          type: object
                          required: [pathPrefix, url]
                          properties:
                            pathPrefix:
                              type: string
                              description: Case-sensitive string prefix. Longer prefixes take priority within this host block.
                            url:
                              type: string
                              description: >-
                                HTTP, HTTPS or h2c backend URL without credentials, query or fragment.
                                Kubernetes Services use their DNS name and Service port.
                                h2c uses HTTP/2 without TLS.
                                HTTPS verifies the upstream certificate using system CAs and the URL host.
                                The URL path is prepended after stripPrefix; the request query is preserved.
                                Host is set from the URL before custom headers.
                            stripPrefix:
                              type: boolean
                              description: When true, pathPrefix is removed before forwarding to the backend.
                            headers:
                              type: object
                              minProperties: 1
                              description: Header templates with secret[name][key] or cm[name][key] placeholders in braces, and remote_host for the client IP. Sources are in the IngressGroup namespace. Double braces escape literal braces. An empty result removes the header.
                              additionalProperties:
                                type: string
